services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wbpro
      POSTGRES_PASSWORD: wbpro
      POSTGRES_DB: wbpro
    ports:
      - "5432:5432"
    volumes:
      - wbpro_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  wbpro_pg:
